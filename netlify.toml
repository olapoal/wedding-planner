[build]
  publish = "."
  functions = "netlify/functions"

# Routing Canonical Admin: /admin/
[[redirects]]
  from = "/admin.html"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Routing Canonical Home: /
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
